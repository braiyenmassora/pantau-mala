name: CI

on:
  push:
    branches: [main, master, feat/pantau-mala-go-integration]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Vitest/jsdom currently require Node for DOM workers. Bun owns install/dev/build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --bun tsc -b --pretty false
      - run: bun run --bun test
      - run: bun run --bun audit:ui
      - name: Reject production build without VITE_DATA_URL
        run: |
          if VITE_DATA_URL= bun scripts/check-prod-data-url.mjs; then
            echo "expected check-prod-data-url to fail when VITE_DATA_URL is empty"
            exit 1
          fi
      - name: Production build with data URL
        env:
          VITE_DATA_URL: /api/v1
        run: bun run --bun build
