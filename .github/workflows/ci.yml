name: CI

on:
  push:
    branches: [main, develop, lutuk/personal]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm run audit:ui
      - name: Reject production build without VITE_DATA_URL
        run: |
          if VITE_DATA_URL= node scripts/check-prod-data-url.mjs; then
            echo "expected check-prod-data-url to fail when VITE_DATA_URL is empty"
            exit 1
          fi
      - name: Production build with data URL
        env:
          VITE_DATA_URL: /api/v1
        run: pnpm run build
