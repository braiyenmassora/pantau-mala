name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm audit:ui
      - run: pnpm a11y:check
      - name: Reject production build without VITE_DATA_URL
        run: |
          if node scripts/check-prod-data-url.mjs; then
            echo "expected check-prod-data-url to fail when VITE_DATA_URL is empty"
            exit 1
          fi
      - name: Production build with data URL
        env:
          VITE_DATA_URL: /data
        run: pnpm build
