name: Deploy personal frontend to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-cloudflare-personal
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/lutuk/personal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve release commit
        id: release
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${WORKFLOW_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: |
          pnpm run lint
          pnpm exec tsc -b --pretty false
          pnpm test
          pnpm run audit:ui

      - name: Build production assets
        env:
          VITE_DATA_URL: /api/v1
        run: pnpm run build

      - name: Check Cloudflare credentials
        id: check_creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment secrets not configured in repository; skipping automated deployment."
            echo "Deploy manually with 'pnpm exec wrangler deploy' or add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.check_creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
